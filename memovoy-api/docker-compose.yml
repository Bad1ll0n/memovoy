services:
  # PostgreSQL 16 com TimescaleDB e PostGIS
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: memovoy-db
    environment:
      POSTGRES_USER: memovoy
      POSTGRES_PASSWORD: memovoy_dev_password
      POSTGRES_DB: memovoy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memovoy -d memovoy_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis para cache (feature flags, feed, sessões)
  redis:
    image: redis:7-alpine
    container_name: memovoy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API em desenvolvimento com hot-reload
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: memovoy-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://memovoy:memovoy_dev_password@db:5432/memovoy_dev
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
