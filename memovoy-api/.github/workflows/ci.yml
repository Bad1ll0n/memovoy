# .github/workflows/ci.yml
# CI/CD para a API MemoVoy.
#
# Fluxo:
#   1. test     — unit tests + type check em cada PR
#   2. build    — Docker image com cache de layers
#   3. deploy   — rolling update no cluster Kubernetes
#
# Secrets necessários no repositório GitHub:
#   DATABASE_URL_TEST  — BD de teste (não produção!)
#   DOCKER_REGISTRY    — ex: ghcr.io/memovoy ou registry.digitalocean.com/memovoy
#   DOCKER_USERNAME    — utilizador do registry
#   DOCKER_PASSWORD    — token do registry
#   KUBE_CONFIG        — kubeconfig em base64 (kubectl get cluster)
#   ANTHROPIC_API_KEY  — para testes de integração (opcional)

name: CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['memovoy-api/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['memovoy-api/**']

env:
  REGISTRY:   ${{ secrets.DOCKER_REGISTRY }}
  IMAGE_NAME: memovoy-api

jobs:
  # ─── Job 1: Testes ──────────────────────────────────────────────────────────
  test:
    name: Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER:     memovoy_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB:       memovoy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memovoy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: memovoy-api/package-lock.json

      - name: Instalar dependências
        working-directory: memovoy-api
        run: npm ci

      - name: Aplicar migrations na BD de teste
        working-directory: memovoy-api
        env:
          DATABASE_URL: postgresql://memovoy_test:test_password@localhost:5432/memovoy_test
        run: |
          # Instalar Flyway CLI
          wget -q https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.0.0/flyway-commandline-10.0.0-linux-x64.tar.gz
          tar -xzf flyway-commandline-10.0.0-linux-x64.tar.gz
          ./flyway-10.0.0/flyway \
            -url="jdbc:postgresql://localhost:5432/memovoy_test" \
            -user=memovoy_test -password=test_password \
            -locations="filesystem:db/migrations" \
            migrate

      - name: Unit tests
        working-directory: memovoy-api
        env:
          # Variáveis mínimas para arrancar — valores de teste
          JWT_ACCESS_SECRET:    test_access_secret_64_bytes_xxxxxxxxxxxxxxxxxxxx
          JWT_REFRESH_SECRET:   test_refresh_secret_64_bytes_xxxxxxxxxxxxxxxxxxx
          EMAIL_ENCRYPTION_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfeHh4eHh4eHh4eHg=
          ANTHROPIC_API_KEY:    sk-ant-test
          DATABASE_URL:         postgresql://memovoy_test:test_password@localhost:5432/memovoy_test
        run: npm test

      - name: Integration tests
        working-directory: memovoy-api
        env:
          JWT_ACCESS_SECRET:    test_access_secret_64_bytes_xxxxxxxxxxxxxxxxxxxx
          JWT_REFRESH_SECRET:   test_refresh_secret_64_bytes_xxxxxxxxxxxxxxxxxxx
          EMAIL_ENCRYPTION_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfeHh4eHh4eHh4eHg=
          ANTHROPIC_API_KEY:    sk-ant-test
          DATABASE_URL:         postgresql://memovoy_test:test_password@localhost:5432/memovoy_test
        run: npm run test:integration

  # ─── Job 2: Build da imagem Docker ─────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup BuildKit com cache
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        id: build
        uses: docker/build-push-action@v5
        with:
          context:    memovoy-api
          file:       memovoy-api/Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          # Cache de layers entre builds — reduz tempo de 4min para ~40s
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          # Metadados para rastreabilidade
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            GIT_SHA=${{ github.sha }}

  # ─── Job 3: Deploy para Kubernetes ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url:  https://api.memovoy.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy — rolling update
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | head -c 7)"

          # Actualizar a imagem no deployment — Kubernetes faz rolling update
          kubectl set image deployment/memovoy-api \
            api="$IMAGE" \
            --namespace=memovoy \
            --record

          # Aguardar rollout completo (timeout 5 min)
          kubectl rollout status deployment/memovoy-api \
            --namespace=memovoy \
            --timeout=300s

          echo "✓ Deploy concluído: $IMAGE"

      - name: Verificar health após deploy
        run: |
          # Aguardar 10s para os pods estabilizarem
          sleep 10
          STATUS=$(curl -sf https://api.memovoy.com/health | jq -r .status)
          if [ "$STATUS" != "ok" ]; then
            echo "❌ Health check falhou após deploy: $STATUS"
            exit 1
          fi
          echo "✓ API saudável após deploy"

      - name: Rollback automático em caso de falha
        if: failure()
        run: |
          echo "⚠️ Deploy falhou — a fazer rollback…"
          kubectl rollout undo deployment/memovoy-api --namespace=memovoy
          kubectl rollout status deployment/memovoy-api --namespace=memovoy --timeout=120s
          echo "✓ Rollback concluído"
