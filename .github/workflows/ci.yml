name: CI

on:
  # Sem filtro de branches: corre em qualquer push, para um erro aparecer no
  # ramo de trabalho e não só quando chega ao main. O concurrency abaixo
  # cancela runs antigos, por isso não se acumulam.
  push:
  pull_request:

# Cancela runs antigos do mesmo branch quando chega um push novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memovoy-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memovoy-api/package-lock.json

      - run: npm ci

      # Testes unitários: não tocam na base de dados nem fazem rede.
      # As variáveis falsas vivem em test/test.env.
      - run: npm test

  api-integration:
    name: API — integração
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memovoy-api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memovoy_test
        ports:
          - 5432:5432
        # Sem isto os passos arrancam antes de o Postgres aceitar ligações.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memovoy-api/package-lock.json

      - run: npm ci

      # As credenciais do serviço acima coincidem com as de test/integration.env,
      # por isso não é preciso passar DATABASE_URL aqui.
      - name: Aplicar migrations
        run: npm run test:integration:setup

      - name: Testes de integração
        run: npm run test:integration

  web:
    name: Web — testes, typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memovoy-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memovoy-web/package-lock.json

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  lint:
    name: Web — lint
    runs-on: ubuntu-latest
    # Bloqueante desde 2026-08-18, quando os 25 erros do ESLint 9 / React 19
    # foram resolvidos. Restam 25 avisos, que não fazem falhar o job.
    defaults:
      run:
        working-directory: memovoy-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memovoy-web/package-lock.json

      - run: npm ci

      - run: npm run lint

  seguranca:
    name: Segurança — dependências e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Precisa do histórico todo para o varrimento de segredos poder olhar
          # para os commits, não só para a árvore actual.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bloqueante a partir de 'high'. As moderadas avisam mas não param o
      # pipeline: em transitivas de ferramentas de desenvolvimento aparecem com
      # frequência e nem sempre há correcção no momento. Ambos os workspaces
      # estão hoje a zero — se subir, quero saber no push, não num audit manual.
      - name: Auditar dependências da API
        working-directory: memovoy-api
        run: npm audit --audit-level=high

      - name: Auditar dependências do web
        working-directory: memovoy-web
        run: npm audit --audit-level=high

      # Varrimento de segredos sem depender de nenhuma action de terceiros: uma
      # action externa neste sítio é ela própria supply chain, e o que se procura
      # aqui são padrões conhecidos, não análise de entropia.
      #
      # Os .env estão no .gitignore, mas o .gitignore protege o futuro e não o
      # passado — isto olha para o que já está versionado.
      - name: Procurar segredos versionados
        run: |
          set -u
          padroes='(AKIA[0-9A-Z]{16}|gsk_[A-Za-z0-9]{40,}|sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,})'

          # Ficheiros versionados apenas. O docker-compose.yml tem minioadmin/
          # minioadmin, que são as credenciais do contentor local e estão lá de
          # propósito — não batem em nenhum destes padrões.
          if git grep -nIE "$padroes" -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::Encontrado o que parece ser um segredo em ficheiros versionados."
            exit 1
          fi

          echo "Nenhum padrão de segredo conhecido em ficheiros versionados."

      # O .env nunca pode entrar no repositório. O .gitignore trata disso, mas
      # um `git add -f` passa-lhe à frente sem avisar ninguém.
      - name: Confirmar que nenhum .env está versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "::error::Um ficheiro .env está versionado."
            exit 1
          fi
          echo "Nenhum .env versionado."
